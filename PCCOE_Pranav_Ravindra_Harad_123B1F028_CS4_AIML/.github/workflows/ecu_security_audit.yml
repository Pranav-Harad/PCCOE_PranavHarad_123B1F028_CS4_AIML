name: Automotive ECU DevSecOps & MISRA Compliance Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ecu-safety-triage:
    name: Automotive ECU Static Triage & MISRA Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Automotive Firmware Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Review Workstation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute 25-Scenario Automotive Benchmark Suite
      run: |
        python Evaluation_Results/run_evaluation.py

    - name: Upload Compliance Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: automotive-compliance-audit-artifacts
        path: |
          Evaluation_Results/evaluation_charts.png
          Documentation/PCCOE_PranavHarad_123B1F028_Technical_Report.pdf
          Synopsis/PCCOE_PranavHarad_123B1F028_Synopsis.pdf
